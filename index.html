<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header -->
    <header class="header">
        <h1>My Online Store</h1>
        <nav>
            <ul class="nav-links">
                <li><a href="#">Home</a></li>
                <li><a href="#">Electronics</a></li>
                <li><a href="#">Fashion</a></li>
                <li><a href="#">Books</a></li>
            </ul>
        </nav>
    </header>

    <!-- Categories Section -->
    <section class="categories">
        <h2>Shop by Category</h2>
        <div class="category-list">
            <button class="category-btn">Electronics</button>
            <button class="category-btn">Fashion</button>
            <button class="category-btn">Home Appliances</button>
            <button class="category-btn">Books</button>
        </div>
    </section>

    <!-- Product Section -->
    <section class="products">
        <h2>Products</h2>
        <div id="product-container" class="product-grid">
            <!-- Product cards will be added here dynamically -->
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
